version: "3.1"

rules:
  - rule: Chào người dùng
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Kích hoạt form đặt xe
    steps:
      - intent: book_ride
      - action: ride_booking_form
      - active_loop: ride_booking_form

  - rule: Submit form đặt xe
    condition:
      - active_loop: ride_booking_form
    steps:
      - action: ride_booking_form
      - active_loop: null
      - action: action_confirm_ride

  - rule: Hủy đặt xe
    steps:
      - intent: cancel
      - action: utter_cancel

  - rule: Tạm biệt
    steps:
      - intent: goodbye
      - action: utter_goodbye