version: "3.1"

nlu:
  - intent: greet
    examples: |
      - xin chào
      - chào bạn
      - hello
      - hi

  - intent: goodbye
    examples: |
      - tạm biệt
      - bye
      - gặp lại sau

  - intent: book_ride
    examples: |
      - tôi muốn đặt xe
      - đặt xe giúp tôi
      - tôi cần gọi xe
      - gọi xe cho tôi
      - đặt xe từ [Cầu Rồng](from_location) đến [VKU](to_location)
      - tôi muốn đi từ [bến xe](from_location) đến [sân bay](to_location)
      - gọi [xe máy](vehicle_type) từ [VKU](from_location) đến [sân bay](to_location)
      - đặt [ô tô](vehicle_type) đi từ [bến xe](from_location) đến [Cầu Rồng](to_location)

  - intent: inform
    examples: |
      - tôi đi từ [VKU](from_location)
      - điểm đi là [VKU](from_location)
      - từ [VKU](from_location)
      - đón tôi ở [VKU](from_location)
      - [VKU](from_location)
      - tôi muốn đến [sân bay](to_location)
      - đến [sân bay](to_location)
      - điểm đến là [sân bay](to_location)
      - [sân bay](to_location)
      - [xe máy](vehicle_type)
      - tôi muốn đi [xe máy](vehicle_type)
  - intent: confirm
    examples: |
      - đúng rồi
      - ok
      - chính xác
      - đồng ý

  - intent: cancel
    examples: |
      - hủy
      - thôi không đặt nữa
      - không cần nữa

  - synonym: xe máy
    examples: |
      - motorbike
      - bike

  - synonym: ô tô
    examples: |
      - car
      - taxi