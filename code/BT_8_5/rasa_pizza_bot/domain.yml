version: "3.1"

intents:
  - greet
  - goodbye
  - book_ride
  - inform
  - confirm
  - cancel

entities:
  - from_location
  - to_location
  - vehicle_type

slots:
  from_location:
    type: text
    mappings:
      - type: from_entity
        entity: from_location

  to_location:
    type: text
    mappings:
      - type: from_entity
        entity: to_location

  vehicle_type:
    type: text
    mappings:
      - type: from_entity
        entity: vehicle_type

forms:
  ride_booking_form:
    required_slots:
      - from_location
      - to_location
      - vehicle_type

responses:
  utter_greet:
    - text: "Xin chào! Tôi là RideBot. Bạn muốn đặt xe đi đâu?"

  utter_goodbye:
    - text: "Tạm biệt bạn!"

  utter_ask_from_location:
    - text: "Bạn muốn đi từ đâu?"

  utter_ask_to_location:
    - text: "Bạn muốn đi đến đâu?"

  utter_ask_vehicle_type:
    - text: "Bạn muốn đi loại xe gì? Ví dụ: xe máy, ô tô, 4 chỗ, 7 chỗ."

  utter_cancel:
    - text: "Đã hủy yêu cầu đặt xe."

actions:
  - action_confirm_ride